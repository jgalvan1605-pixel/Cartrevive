<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CartRevive Login</title>
<script src="https://cdn.tailwindcss.com"></script>
</head><body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">
<div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
<h1 class="text-xl font-bold text-center mb-4 text-indigo-400">CartRevive Panel</h1>
<div id="debugLog" class="p-3 mb-4 rounded-xl text-xs font-mono bg-black/60 border border-slate-800 text-slate-300 min-h-[60px] whitespace-pre-wrap">Esperando acción...</div>
<div class="space-y-3">
<div><label class="text-xs text-slate-400">Email</label>
<input id="email" type="email" value="administracion@akonfitness.com" class="w-full p-2.5 bg-slate-950 border border-slate-700 rounded-xl text-sm mt-1 text-white"></div>
<div><label class="text-xs text-slate-400">Contraseña</label>
<input id="pass" type="password" value="password123" class="w-full p-2.5 bg-slate-950 border border-slate-700 rounded-xl text-sm mt-1 text-white"></div>
<button id="btn" onclick="iniciarSesionDirecta()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-bold rounded-xl text-sm mt-2 transition cursor-pointer">Entrar al Panel</button>
</div></div><script>
function log(msg) {
  const d = document.getElementById('debugLog');
  d.innerText += '\n' + msg;
  console.log(msg);
}
async function iniciarSesionDirecta() {
  const logBox = document.getElementById('debugLog');
  logBox.innerText = '1. Botón pulsado.';
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('pass').value;
  const btn = document.getElementById('btn');
  btn.disabled = true;
  btn.innerText = 'Procesando...';
  const targetHost = (window.location.hostname.includes('render.com')) ? '' : 'https://cartrevive.onrender.com';
  log('2. Conectando a: ' + (targetHost || 'mismo servidor') + '/api/auth/login');
  try {
    const res = await fetch(targetHost + '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    log('3. Respuesta HTTP: ' + res.status);
    const data = await res.json();
    if (!res.ok || !data.token) {
      log('❌ Error: ' + (data.error || 'Credenciales no válidas'));
      btn.disabled = false;
      btn.innerText = 'Entrar al Panel';
      return;
    }
    log('4. Token recibido. Guardando sesión...');
    localStorage.setItem('token', data.token);
    localStorage.setItem('cartrevive_token', data.token);
    log('5. Redirigiendo a dashboard...');
    setTimeout(() => { window.location.href = 'dashboard.html'; }, 500);
  } catch (err) {
    log('❌ Excepción de red: ' + err.message);
    btn.disabled = false;
    btn.innerText = 'Entrar al Panel';
  }
}
</script></body></html>
