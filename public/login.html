<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso y Registro - CartRevive</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between p-4 selection:bg-indigo-500 selection:text-white relative overflow-x-hidden">
  <div class="fixed top-0 left-1/2 -translate-x-1/2 w-[700px] h-[350px] bg-gradient-to-tr from-indigo-600/20 via-sky-500/15 to-purple-600/10 rounded-full blur-3xl pointer-events-none -z-10"></div>
  <header class="max-w-md w-full mx-auto pt-4 flex justify-between items-center">
    <a href="index.html" class="flex items-center gap-2.5 group">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-600 to-sky-500 flex items-center justify-center text-white shadow-lg shadow-indigo-600/30 group-hover:scale-105 transition">
        <i class="fa-solid fa-rotate-right text-xs"></i>
      </div>
      <span class="text-base font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-200 to-indigo-300 bg-clip-text text-transparent">CartRevive</span>
    </a>
    <a href="index.html" class="text-xs font-semibold text-slate-400 hover:text-white transition flex items-center gap-1.5">
      <i class="fa-solid fa-arrow-left text-[10px]"></i> Volver
    </a>
  </header>
  <main class="max-w-md w-full mx-auto my-auto bg-slate-900/80 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl backdrop-blur">
    <div class="grid grid-cols-2 bg-slate-950 p-1 rounded-2xl border border-slate-800 mb-6">
      <button type="button" id="tabLogin" onclick="setMode('login')" class="py-2.5 text-xs font-bold rounded-xl transition">Iniciar Sesión</button>
      <button type="button" id="tabRegister" onclick="setMode('register')" class="py-2.5 text-xs font-bold rounded-xl transition">Probar 15 Días Gratis</button>
    </div>
    <div id="alertBox" class="hidden mb-4 p-3 rounded-xl text-xs font-semibold flex items-center gap-2 border"></div>
    <form id="authForm" onsubmit="event.preventDefault(); triggerSubmit();" class="space-y-3.5">
      <div id="fieldShopName" class="space-y-1 hidden">
        <label class="block text-xs font-semibold text-slate-300">Nombre de la Tienda</label>
        <div class="relative">
          <i class="fa-solid fa-store absolute left-3.5 top-3 text-xs text-slate-500"></i>
          <input id="inputName" type="text" placeholder="Ej. Akon Fitness" class="w-full pl-9 pr-3 py-2.5 bg-slate-950 border border-slate-700/80 rounded-xl text-xs text-white focus:outline-none focus:border-indigo-500 transition">
        </div>
      </div>
      <div class="space-y-1">
        <label class="block text-xs font-semibold text-slate-300">Email Corporativo</label>
        <div class="relative">
          <i class="fa-solid fa-envelope absolute left-3.5 top-3 text-xs text-slate-500"></i>
          <input id="inputEmail" type="email" required placeholder="admin@tutienda.com" class="w-full pl-9 pr-3 py-2.5 bg-slate-950 border border-slate-700/80 rounded-xl text-xs text-white focus:outline-none focus:border-indigo-500 transition">
        </div>
      </div>
      <div class="space-y-1">
        <label class="block text-xs font-semibold text-slate-300">Contraseña</label>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-3.5 top-3 text-xs text-slate-500"></i>
          <input id="inputPassword" type="password" required placeholder="••••••••" class="w-full pl-9 pr-3 py-2.5 bg-slate-950 border border-slate-700/80 rounded-xl text-xs text-white focus:outline-none focus:border-indigo-500 transition">
        </div>
      </div>
      <div id="fieldThreshold" class="space-y-1 hidden">
        <label class="block text-xs font-semibold text-slate-300">Umbral mínimo carrito (€)</label>
        <div class="relative">
          <i class="fa-solid fa-euro-sign absolute left-3.5 top-3 text-xs text-slate-500"></i>
          <input id="inputThreshold" type="number" value="150" class="w-full pl-9 pr-3 py-2.5 bg-slate-950 border border-slate-700/80 rounded-xl text-xs text-white focus:outline-none focus:border-indigo-500 transition">
        </div>
      </div>
      <button type="submit" id="btnSubmit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] text-white font-bold text-xs md:text-sm rounded-xl shadow-lg shadow-indigo-600/30 transition flex items-center justify-center gap-2 mt-2 cursor-pointer">
        <i class="fa-solid fa-bolt" id="btnIcon"></i>
        <span id="btnText">Entrar al Panel</span>
      </button>
    </form>
    <div class="mt-5 pt-4 border-t border-slate-800 text-center">
      <p class="text-xs text-slate-400" id="footerText"></p>
    </div>
  </main>
  <footer class="text-center text-[11px] text-slate-600 py-3">© 2026 CartRevive. Plataforma de Venta Asistida.</footer>
  <script>
    let mode = 'login';
    function setMode(newMode) {
      mode = newMode;
      const tabL = document.getElementById('tabLogin');
      const tabR = document.getElementById('tabRegister');
      const fName = document.getElementById('fieldShopName');
      const fThresh = document.getElementById('fieldThreshold');
      const bText = document.getElementById('btnText');
      const fText = document.getElementById('footerText');
      const alertBox = document.getElementById('alertBox');
      alertBox.className = 'hidden';
      if (mode === 'login') {
        tabL.className = 'py-2.5 text-xs font-bold rounded-xl bg-indigo-600 text-white shadow-md shadow-indigo-600/25';
        tabR.className = 'py-2.5 text-xs font-semibold rounded-xl text-slate-400 hover:text-white';
        fName.classList.add('hidden');
        fThresh.classList.add('hidden');
        bText.innerText = 'Entrar al Panel';
        fText.innerHTML = '¿No tienes cuenta? <button type="button" onclick="setMode(\'register\')" class="text-indigo-400 hover:underline font-semibold">Crea tu prueba gratis de 15 días</button>';
      } else {
        tabR.className = 'py-2.5 text-xs font-bold rounded-xl bg-indigo-600 text-white shadow-md shadow-indigo-600/25';
        tabL.className = 'py-2.5 text-xs font-semibold rounded-xl text-slate-400 hover:text-white';
        fName.classList.remove('hidden');
        fThresh.classList.remove('hidden');
        bText.innerText = 'Crear Cuenta y Empezar Gratis';
        fText.innerHTML = '¿Ya tienes cuenta? <button type="button" onclick="setMode(\'login\')" class="text-indigo-400 hover:underline font-semibold">Inicia Sesión</button>';
      }
    }
    const params = new URLSearchParams(window.location.search);
    if (params.get('mode') === 'register') setMode('register'); else setMode('login');

    async function triggerSubmit() {
      const email = document.getElementById('inputEmail').value.trim();
      const password = document.getElementById('inputPassword').value;
      const name = document.getElementById('inputName').value.trim();
      const minThreshold = document.getElementById('inputThreshold').value;
      const alertBox = document.getElementById('alertBox');
      const btn = document.getElementById('btnSubmit');
      const bText = document.getElementById('btnText');
      const bIcon = document.getElementById('btnIcon');

      alertBox.className = 'hidden';
      btn.disabled = true;
      bText.innerText = 'Verificando...';
      bIcon.className = 'fa-solid fa-circle-notch fa-spin';

      const isRemote = window.location.hostname !== 'cartrevive.onrender.com' && !window.location.hostname.includes('localhost') && !window.location.hostname.includes('127.0.0.1');
      const baseUrl = isRemote ? 'https://cartrevive.onrender.com' : '';
      const endpoint = baseUrl + (mode === 'login' ? '/api/auth/login' : '/api/auth/register');
      const payload = mode === 'login' ? { email, password } : { email, password, name: name || 'Mi Tienda Online', minThreshold: parseFloat(minThreshold) || 150 };

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok || !data.token) {
          alertBox.className = 'mb-4 p-3 rounded-xl text-xs font-semibold flex items-center gap-2 border bg-red-500/10 border-red-500/30 text-red-400';
          alertBox.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i><span>' + (data.error || 'Credenciales inválidas.') + '</span>';
          btn.disabled = false;
          bText.innerText = mode === 'login' ? 'Entrar al Panel' : 'Crear Cuenta y Empezar Gratis';
          bIcon.className = 'fa-solid fa-bolt';
          return;
        }
        localStorage.setItem('token', data.token);
        localStorage.setItem('cartrevive_token', data.token);
        alertBox.className = 'mb-4 p-3 rounded-xl text-xs font-semibold flex items-center gap-2 border bg-emerald-500/10 border-emerald-500/30 text-emerald-400';
        alertBox.innerHTML = '<i class="fa-solid fa-circle-check"></i><span>¡Autenticado con éxito! Redirigiendo...</span>';
        bText.innerText = 'Accediendo...';
        bIcon.className = 'fa-solid fa-check';
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 300);
      } catch (err) {
        alertBox.className = 'mb-4 p-3 rounded-xl text-xs font-semibold flex items-center gap-2 border bg-red-500/10 border-red-500/30 text-red-400';
        alertBox.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i><span>Error de conexión con el servidor.</span>';
        btn.disabled = false;
        bText.innerText = mode === 'login' ? 'Entrar al Panel' : 'Crear Cuenta y Empezar Gratis';
        bIcon.className = 'fa-solid fa-bolt';
      }
    }
  </script>
</body>
</html>
